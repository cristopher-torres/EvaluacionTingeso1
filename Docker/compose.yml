version: "3.8"

services:
  # ---------------------------
  # NGINX para el frontend
  # ---------------------------
  nginx-frontend:
    image: nginx
    container_name: nginx-frontend
    restart: always
    ports:
      - "8070:80"
    volumes:
      - ./nginx-frontend.conf:/etc/nginx/nginx.conf
    networks:
      - frontend-network
    depends_on:
      - frontend1
      - frontend2
      - frontend3

  # ---------------------------
  # Frontends
  # ---------------------------
  frontend1:
    image: crisdocker10/toolrent-frontend:latest
    container_name: frontend1
    networks:
      - frontend-network
      - backend-network

  frontend2:
    image: crisdocker10/toolrent-frontend:latest
    container_name: frontend2
    networks:
      - frontend-network
      - backend-network

  frontend3:
    image: crisdocker10/toolrent-frontend:latest
    container_name: frontend3
    networks:
      - frontend-network
      - backend-network

  # ---------------------------
  # NGINX para el backend
  # ---------------------------
  nginx-backend:
    image: nginx
    container_name: nginx-backend
    restart: always
    ports:
      - "8090:8090"
    volumes:
      - ./nginx-backend.conf:/etc/nginx/nginx.conf
    networks:
      - backend-network
    depends_on:
      - backend1
      - backend2
      - backend3

  # ---------------------------
  # BASE DE DATOS DEL BACKEND
  # ---------------------------
  mysql:
    image: mysql:8.1
    container_name: toolrent-mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: cris123
      MYSQL_DATABASE: dbtoolrent
      MYSQL_USER: ADMIN
      MYSQL_PASSWORD: cris123
    ports:
      - "3307:3306"
    volumes:
      - toolrent-mysql-volume:/var/lib/mysql
    networks:
      - backend-network
    deploy:
      restart_policy:
        condition: on-failure

  # ---------------------------
  # BACKENDS
  # ---------------------------
  backend1:
    image: crisdocker10/toolrent-backend:latest
    container_name: backend1
    environment:
      DB_HOST: toolrent-mysql-container
      DB_PORT: 3306
      DB_NAME: dbtoolrent
      DB_USER: ADMIN
      DB_PASSWORD: cris123

    networks:
      - backend-network
    depends_on:
      - mysql
    deploy:
      restart_policy:
        condition: on-failure

  backend2:
    image: crisdocker10/toolrent-backend:latest
    container_name: backend2
    environment:
      DB_HOST: toolrent-mysql-container
      DB_PORT: 3306
      DB_NAME: dbtoolrent
      DB_USER: ADMIN
      DB_PASSWORD: cris123

    networks:
      - backend-network
    depends_on:
      - mysql
    deploy:
      restart_policy:
        condition: on-failure

  backend3:
    image: crisdocker10/toolrent-backend:latest
    container_name: backend3
    environment:
      DB_HOST: toolrent-mysql-container
      DB_PORT: 3306
      DB_NAME: dbtoolrent
      DB_USER: ADMIN
      DB_PASSWORD: cris123

    networks:
      - backend-network
    depends_on:
      - mysql
    deploy:
      restart_policy:
        condition: on-failure

  # ---------------------------
  # KEYCLOAK DATABASE
  # ---------------------------
  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keypass
    volumes:
      - keycloak-db-volume:/var/lib/postgresql/data
    networks:
      - backend-network

  # ---------------------------
  # KEYCLOAK SERVER
  # ---------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: cristingeso
      KEYCLOAK_ADMIN_PASSWORD: rodrigo12

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keypass

      KC_HOSTNAME_URL: http://localhost:9090
      KC_HOSTNAME_ADMIN_URL: http://localhost:9090
    ports:
      - "9090:8080"
    depends_on:
      - keycloak-db
    networks:
      - backend-network

# ---------------------------
# NETWORKS Y VOLUMENES
# ---------------------------
networks:
  frontend-network:
  backend-network:

volumes:
  toolrent-mysql-volume:
  keycloak-db-volume:
